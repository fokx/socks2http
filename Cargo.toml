[package]
name = "socks2http"
version = "0.4.1"
description = "Convert SOCKS5 proxy to HTTP proxy"
authors = ["fokx <github.com/fokx>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/fokx/socks2http"

[dependencies]
#openssl = { version = "0.10.49" }
#openssl2-sys = "1.0.0"
#hyper = "*"

tokio = { version = "1.52.2", features = ["full"] }
reqwest = { version = "0.13.3", features = ["rustls", "blocking", "socks"] }

log = "0.4.29"

env_logger ="0.11.10"
httparse = "1.10.1"
async-socks5 = "0.6.0"
#tokio-socks = "0.2.0"
#socks = "0.3.2"
futures = "0.3.32"
rand = { version = "0.10.1", features = ["thread_rng"] }
clap = { version = "4.6.1", features = ["derive"] }
